name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Foundry release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read and validate version
        id: module
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).version")"
          ID="$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).id")"

          if [[ "$ID" != "dragons-ante" ]]; then
            echo "::error::Unexpected module id: $ID"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dragons-ante-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.js' -print0)

      - name: Check tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.module.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.module.outputs.tag }} already exists."
            exit 1
          fi

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.module.outputs.version }}"
          ZIP="${{ steps.module.outputs.zip }}"

          mkdir -p dist/dragons-ante

          rsync -a ./ dist/dragons-ante/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude '*.zip'

          (
            cd dist
            zip -r "../$ZIP" dragons-ante
          )

          cp module.json dist/module.json

      - name: Keep build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragons-ante-${{ steps.module.outputs.version }}
          path: |
            ${{ steps.module.outputs.zip }}
            dist/module.json
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.module.outputs.tag }}" \
            "${{ steps.module.outputs.zip }}" \
            "dist/module.json#module.json" \
            --target master \
            --title "Dragon's Ante v${{ steps.module.outputs.version }}" \
            --generate-notes
