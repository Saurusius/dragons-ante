name: Publish Release

on:
  push:
    branches:
      - master
    paths:
      - "module.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Foundry release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read and validate version
        id: module
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).version")"
          ID="$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).id")"

          if [[ "$ID" != "dragons-ante" ]]; then
            echo "::error::Unexpected module id: $ID"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semantic version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dragons-ante-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/v${{ steps.module.outputs.version }}/${{ steps.module.outputs.zip }}"
          EXPECTED_MANIFEST="https://github.com/${{ github.repository }}/releases/latest/download/module.json"
          ACTUAL_DOWNLOAD=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).download || ''")
          ACTUAL_MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).manifest || ''")

          [[ "$ACTUAL_DOWNLOAD" == "$EXPECTED_DOWNLOAD" ]] || { echo "::error::URL download incorrect"; exit 1; }
          [[ "$ACTUAL_MANIFEST" == "$EXPECTED_MANIFEST" ]] || { echo "::error::URL manifest incorrect"; exit 1; }

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.js' -print0)

      - name: Run stabilization tests
        shell: bash
        run: npm test

      - name: Detect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.module.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Foundry package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.module.outputs.version }}"
          ZIP="${{ steps.module.outputs.zip }}"

          mkdir -p dist/dragons-ante

          rsync -a ./ dist/dragons-ante/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude '*.zip'

          (
            cd dist
            zip -r "../$ZIP" dragons-ante
          )

          cp module.json dist/module.json

      - name: Keep build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragons-ante-${{ steps.module.outputs.version }}
          path: |
            ${{ steps.module.outputs.zip }}
            dist/module.json
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.module.outputs.tag }}" \
            "${{ steps.module.outputs.zip }}" \
            "dist/module.json#module.json" \
            --target master \
            --title "Dragon's Ante v${{ steps.module.outputs.version }}" \
            --generate-notes

      - name: Repair existing release assets
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ steps.module.outputs.tag }}" \
            "${{ steps.module.outputs.zip }}" \
            "dist/module.json#module.json" \
            --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ASSETS=$(gh release view "${{ steps.module.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          grep -Fxq "${{ steps.module.outputs.zip }}" <<< "$ASSETS" || { echo "::error::ZIP absent de la release"; exit 1; }
          grep -Fxq "module.json" <<< "$ASSETS" || { echo "::error::module.json absent de la release"; exit 1; }
